<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>粘贴表格文字 → 生成产品清单 Excel</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --line:#e3e8ef; --primary:#2f6fed;
    --text:#1f2937; --muted:#6b7280; --danger:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);padding:20px}
  .wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  h1{font-size:17px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.7}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  textarea{width:100%;height:190px;resize:vertical;border:1px solid var(--line);border-radius:8px;
           padding:10px;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.7;
           outline:none;color:var(--text);background:#fcfdff}
  textarea:focus{border-color:var(--primary);background:#fff}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;
         padding:8px 14px;font-size:14px;color:var(--text);transition:.15s}
  button:hover{border-color:var(--primary);color:var(--primary)}
  button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  button.primary:hover{opacity:.9;color:#fff}
  label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  label input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;
              outline:none;width:72px;text-align:center;color:var(--text)}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:60vh}
  table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
  /* 让第4、5、6、7列的表头文字居中 */
th:nth-child(4), th:nth-child(5), th:nth-child(6), th:nth-child(7) {
    text-align: center;
}
  th{background:#f8fafc;font-weight:600;color:#374151;position:sticky;top:0;z-index:2;white-space:nowrap}
  tbody tr:hover{background:#fbfdff}
  td input{width:100%;border:1px solid transparent;background:transparent;padding:6px;
           border-radius:5px;font-size:13px;font-family:inherit;color:inherit}
  td input:hover{border-color:var(--line)}
  td input:focus{border-color:var(--primary);background:#fff;outline:none}
  td input.num{text-align:center}
  td input[readonly]{background:#f3f6fa;color:#334155;cursor:default}
  td input[readonly]:hover{border-color:transparent}
  td.idx{color:var(--muted);width:46px;text-align:center}
  td.op{width:60px;text-align:center}
  .del{border:none;background:transparent;color:var(--danger);padding:4px 6px;font-size:12px}
  .del:hover{background:#fef2f2;border-radius:5px}
  .status{font-size:13px;color:var(--muted);margin-left:auto}
  .empty{padding:36px;text-align:center;color:var(--muted);font-size:13px}
  .tip{font-size:12px;color:var(--muted);margin-top:8px}
  /* 合计行 */
  tfoot td{background:#f0f5ff;font-weight:600;border-top:2px solid #c7d8f8;border-bottom:none;padding:8px}
  tfoot td.num{text-align:right}
  tfoot td.total-label{text-align:right;color:#1d4ed8}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>粘贴表格文字 → 整理成产品清单 → 导出 Excel</h1>
    <div class="sub">
      直接从网页表格里全选复制，粘贴到下面即可。支持 <b>制表符 / 多空格 / 竖线</b> 分隔；
      自动识别表头，自动忽略「产品编号、描述、备注」等无关列；
      <b>产品金额 = 产品数量 × 产品单价（自动计算，不取原始金额）</b>。
    </div>
    <div style="margin-top:12px">
      <textarea id="input" placeholder="把网页表格复制粘贴到这里……"></textarea>
    </div>
    <div class="bar">
      <button class="primary" id="parseBtn">解析并生成表格</button>
      <button id="sampleBtn">填充示例</button>
      <button id="clearBtn">清空</button>
      <label>默认税率 <input type="text" id="defaultTax" value="0.13"></label>
      <span class="tip">税率可写 13% 或 0.13，导出时统一为百分比格式</span>
    </div>
  </div>

  <div class="card">
    <div class="bar" style="margin-top:0;margin-bottom:10px">
      <button class="primary" id="exportBtn">导出 Excel</button>
      <button id="addRowBtn">新增一行</button>
      <span class="status" id="status">共 0 条</span>
    </div>
    <div class="tablewrap">
      <table id="result">
        <thead>
          <tr>
            <th>#</th>
            <th>产品名称</th>
            <th>产品型号</th>
            <th>产品数量</th>
            <th>产品单价</th>
            <th>产品金额</th>
            <th>税率</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr class="total-row">
            <td></td>
            <td>合计</td>
            <td></td>
            <td class="num" id="totalQty">0</td>
            <td></td>
            <td class="num" id="totalAmount">0.00</td>
            <td></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="tip">表格内容可直接修改；金额由「数量 × 单价」自动计算，不可手工编辑；合计行实时更新。</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function () {
  'use strict';

  /* =========================================================
     一、基础工具
     ========================================================= */

  var $ = function (s) { return document.querySelector(s); };

  function escapeAttr(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

  /** 从任意文本中抽出数字，如 "¥1,500.00元" -> 1500 */
  function toNumber(v) {
    if (v === null || v === undefined) return null;
    var s = String(v).replace(/\u00a0/g, ' ').trim();
    if (!s) return null;
    s = s.replace(/[,，\s]/g, '').replace(/[¥￥$]/g, '');
    var m = s.match(/-?\d+(?:\.\d+)?/);
    if (!m) return null;
    var n = parseFloat(m[0]);
    return isNaN(n) ? null : n;
  }

  /** 税率解析：13% -> 0.13 ；13 -> 0.13 ；0.13 -> 0.13 */
  function toTax(v, def) {
    if (v === null || v === undefined) return def;
    var s = String(v).trim();
    if (!s) return def;
    var pm = s.match(/(\d+(?:\.\d+)?)\s*[%％]/);
    if (pm) return parseFloat(pm[1]) / 100;
    var n = toNumber(s);
    if (n === null) return def;
    return n > 1 ? n / 100 : n;
  }

  function clean(v) {
    return String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
  }

  function looksNumeric(s) {
    s = String(s).trim();
    if (!s) return false;
    return /^[¥￥$]?\s*[-+]?\d/.test(s);
  }

  function fmtNum(n) {
    return (n === null || n === undefined || n === '') ? '' : String(n);
  }

  /* =========================================================
     二、把粘贴的文字切成「行 → 单元格」
     ========================================================= */

  function splitCells(line) {
    var s = line.replace(/\u00a0/g, ' ');

    if (s.indexOf('\t') !== -1) {
      return s.split('\t').map(function (v) { return v.trim(); });
    }
    if (s.indexOf('|') !== -1) {
      var parts = s.split('|').map(function (v) { return v.trim(); });
      if (parts[0] === '') parts.shift();
      if (parts[parts.length - 1] === '') parts.pop();
      return parts;
    }
    if (/\s{2,}/.test(s)) {
      return s.split(/\s{2,}/).map(function (v) { return v.trim(); })
              .filter(function (v) { return v !== ''; });
    }
    return s.split(/\s+/).filter(function (v) { return v !== ''; });
  }

  function toMatrix(text) {
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    var rows = [];
    for (var i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      rows.push(splitCells(lines[i]));
    }
    return rows;
  }

  /* =========================================================
     三、表头识别
     ========================================================= */

  var HEADER_MAP = [
    { field: 'tax',    keys: ['税率', '税点', 'tax'] },
    { field: 'amount', keys: ['价税合计', '含税金额', '总金额', '金额', '总价', '合计', '小计', '总额', 'amount'] },
    { field: 'price',  keys: ['单价', '价格', '售价', 'price', 'unitprice'] },
    { field: 'qty',    keys: ['数量', '件数', '个数', '数目', 'qty', 'quantity'] },
    { field: 'model',  keys: ['规格型号', '型号', '规格', 'model', 'spec', '机种'] },
    { field: 'code',   keys: ['编号', '编码', '料号', '货号', 'code', 'sku', '序号', 'id'] },
    { field: 'name',   keys: ['产品名称', '商品名称', '物料名称', '货物名称', '品名', '名称', '产品', '商品', '物料', '货物', 'name', '项目'] },
    { field: 'remark', keys: ['备注', '说明', '描述', 'remark', 'note', 'desc'] }
  ];

  function matchHeaderField(cell) {
    var c = String(cell).toLowerCase().replace(/[\s()（）\[\]【】:：*\/]/g, '');
    if (!c) return null;
    for (var i = 0; i < HEADER_MAP.length; i++) {
      var item = HEADER_MAP[i];
      for (var j = 0; j < item.keys.length; j++) {
        if (c.indexOf(item.keys[j]) !== -1) return item.field;
      }
    }
    return null;
  }

  function findHeader(rows) {
    var limit = Math.min(rows.length, 5);
    for (var i = 0; i < limit; i++) {
      var map = {}, hits = 0;
      for (var j = 0; j < rows[i].length; j++) {
        var f = matchHeaderField(rows[i][j]);
        if (f && !(f in map)) { map[f] = j; hits++; }
      }
      if (hits >= 2) return { index: i, map: map };
    }
    return null;
  }

  /* =========================================================
     四、生成一条记录
     金额 = 数量 × 单价（自动计算，不再取原始金额列）
     ========================================================= */

  function buildRecord(nameRaw, modelRaw, qtyRaw, priceRaw, taxRaw, defaultTax) {
    var name = clean(nameRaw);
    var model = clean(modelRaw);
    var qty = toNumber(qtyRaw);
    var price = toNumber(priceRaw);

    // 数量、单价都没有 => 视为表头/无关行，丢弃
    if (qty === null && price === null) return null;

    // 金额自动计算：数量 × 单价（二者缺一则金额为空）
    var amount = (qty !== null && price !== null) ? round2(qty * price) : null;

    var tax = toTax(taxRaw, defaultTax);

    return {
      name: name,
      model: model,
      qty: qty,
      price: price,
      amount: amount,
      taxText: String(tax)
    };
  }

  /** 没有表头时的兜底：文本列 → 名称/型号；数字列 → 数量/单价（忽略第三数字列） */
  function heuristicRecord(cells, defaultTax) {
    var nums = [], texts = [];
    for (var i = 0; i < cells.length; i++) {
      var s = String(cells[i]).trim();
      if (!s) continue;
      if (looksNumeric(s)) nums.push(toNumber(s));
      else texts.push(s);
    }
    if (!nums.length) return null;

    return buildRecord(
      texts[0] || '',
      texts[1] || '',
      nums[0],
      nums.length > 1 ? nums[1] : null,
      '',
      defaultTax
    );
  }

  function isBlankRow(r) {
    for (var i = 0; i < r.length; i++) if (String(r[i]).trim() !== '') return false;
    return true;
  }

  /* =========================================================
     五、主解析流程
     ========================================================= */

  function parseText(text, defaultTax) {
    var raw = toMatrix(text);
    if (!raw.length) return [];

    var maxCols = 0;
    raw.forEach(function (r) { if (r.length > maxCols) maxCols = r.length; });

    var rows = raw.map(function (r) {
      var a = r.slice();
      while (a.length < maxCols) a.push('');
      return a;
    });

    var hdr = findHeader(rows);
    var out = [];

    if (hdr) {
      var map = hdr.map;
      for (var i = hdr.index + 1; i < rows.length; i++) {
        var r = rows[i];
        if (isBlankRow(r)) continue;
        var get = function (f) { return map[f] !== undefined ? r[map[f]] : ''; };
        var rec = buildRecord(get('name'), get('model'), get('qty'),
                              get('price'), get('tax'), defaultTax);
        if (rec) out.push(rec);
      }
    } else {
      for (var k = 0; k < rows.length; k++) {
        if (isBlankRow(rows[k])) continue;
        var rec2 = heuristicRecord(rows[k], defaultTax);
        if (rec2) out.push(rec2);
      }
    }
    return out;
  }

  /* =========================================================
     六、表格渲染 & 交互
     ========================================================= */

  var records = [];
  var tbody = $('#result tbody');

  function renderTable() {
    if (!records.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无数据，请粘贴文字后点击「解析并生成表格」</td></tr>';
      updateTotals();
      return;
    }
    var html = '';
    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      html += '<tr>' +
        '<td class="idx">' + (i + 1) + '</td>' +
        '<td><input data-f="name" value="' + escapeAttr(r.name) + '"></td>' +
        '<td><input data-f="model" value="' + escapeAttr(r.model) + '"></td>' +
        '<td><input data-f="qty" class="num" value="' + escapeAttr(fmtNum(r.qty)) + '"></td>' +
        '<td><input data-f="price" class="num" value="' + escapeAttr(fmtNum(r.price)) + '"></td>' +
        '<td><input data-f="amount" class="num" value="' + escapeAttr(fmtNum(r.amount)) + '" readonly tabindex="-1"></td>' +
        '<td><input data-f="tax" class="num" value="' + escapeAttr(r.taxText) + '"></td>' +
        '<td class="op"><button class="del">删除</button></td>' +
      '</tr>';
    }
    tbody.innerHTML = html;
    updateTotals();
  }

  /** 更新合计行与状态栏 */
  function updateTotals() {
    var totalQty = 0, totalAmount = 0;
    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      if (typeof r.qty === 'number') totalQty += r.qty;
      if (typeof r.amount === 'number') totalAmount += r.amount;
    }
    totalQty = Math.round(totalQty * 1e6) / 1e6;
    $('#totalQty').textContent = totalQty;
    $('#totalAmount').textContent = totalAmount.toFixed(2);
    $('#status').textContent = '共 ' + records.length + ' 条　|　总金额：' + totalAmount.toFixed(2);
  }

  // 编辑单元格
  tbody.addEventListener('input', function (e) {
    var inp = e.target;
    if (!inp.matches || !inp.matches('input[data-f]')) return;

    var tr = inp.closest('tr');
    var idx = Array.prototype.indexOf.call(tbody.children, tr);
    var rec = records[idx];
    if (!rec) return;

    var f = inp.dataset.f;

    if (f === 'qty' || f === 'price') {
      rec[f] = toNumber(inp.value);
      // 金额 = 数量 × 单价，自动重算
      var v = (rec.qty !== null && rec.price !== null) ? round2(rec.qty * rec.price) : null;
      rec.amount = v;
      var amtInput = tr.querySelector('input[data-f="amount"]');
      if (amtInput) amtInput.value = fmtNum(v);
      updateTotals();
    } else if (f === 'tax') {
      rec.taxText = inp.value;
    } else {
      rec[f] = inp.value;
    }
  });

  // 删除行
  tbody.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.del') : null;
    if (!btn) return;
    var tr = btn.closest('tr');
    var idx = Array.prototype.indexOf.call(tbody.children, tr);
    if (idx >= 0) {
      records.splice(idx, 1);
      renderTable();
    }
  });

  /* =========================================================
     七、导出 Excel（含合计行）
     ========================================================= */

  function buildAoa() {
    var aoa = [['序号', '产品名称', '产品型号', '产品数量', '产品单价', '产品金额', '税率']];
    var totalQty = 0, totalAmount = 0;

    for (var i = 0; i < records.length; i++) {
      var r = records[i];
      var tax = toTax(r.taxText, 0.13);
      aoa.push([
        i + 1,
        r.name || '',
        r.model || '',
        r.qty === null ? '' : r.qty,
        r.price === null ? '' : r.price,
        r.amount === null ? '' : r.amount,
        tax
      ]);
      if (typeof r.qty === 'number') totalQty += r.qty;
      if (typeof r.amount === 'number') totalAmount += r.amount;
    }

    // 末尾合计行
    aoa.push([
      '', '合计', '',
      Math.round(totalQty * 1e6) / 1e6,
      '',
      round2(totalAmount),
      ''
    ]);

    return aoa;
  }

  function setFormat(ws, r, c, z) {
    var addr = XLSX.utils.encode_cell({ r: r, c: c });
    if (ws[addr] && ws[addr].t === 'n') ws[addr].z = z;
  }

  function exportExcel() {
    if (!records.length) { alert('没有数据可以导出，请先解析表格。'); return; }

    var aoa = buildAoa();
    var totalRowIndex = aoa.length - 1;

    if (typeof XLSX !== 'undefined' && XLSX.utils) {
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [
        { wch: 6 }, { wch: 26 }, { wch: 20 },
        { wch: 10 }, { wch: 12 }, { wch: 14 }, { wch: 10 }
      ];
      var range = XLSX.utils.decode_range(ws['!ref']);
      for (var R = 1; R <= range.e.r; R++) {
        setFormat(ws, R, 3, '0.##');       // 数量
        setFormat(ws, R, 4, '#,##0.00');   // 单价
        setFormat(ws, R, 5, '#,##0.00');   // 金额（含合计行）
        setFormat(ws, R, 6, '0.##%');      // 税率
      }
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '产品清单');
      XLSX.writeFile(wb, '产品清单.xlsx');
    } else {
      exportAsXls(aoa);   // 离线兜底
    }
  }

  function exportAsXls(aoa) {
    var html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1">';
    aoa.forEach(function (row) {
      html += '<tr>' + row.map(function (c) {
        return '<td>' + escapeAttr(c) + '</td>';
      }).join('') + '</tr>';
    });
    html += '</table></body></html>';

    var blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '产品清单.xls';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* =========================================================
     八、按钮绑定
     ========================================================= */

  $('#parseBtn').addEventListener('click', function () {
    var text = $('#input').value;
    if (!text.trim()) { alert('请先把网页表格的内容粘贴到输入框中。'); return; }
    var defTax = toTax($('#defaultTax').value, 0.13);
    records = parseText(text, defTax);
    renderTable();
  });

  $('#exportBtn').addEventListener('click', exportExcel);

  $('#addRowBtn').addEventListener('click', function () {
    var defTax = toTax($('#defaultTax').value, 0.13);
    records.push({
      name: '', model: '', qty: null, price: null, amount: null,
      taxText: String(defTax)
    });
    renderTable();
  });

  $('#clearBtn').addEventListener('click', function () {
    $('#input').value = '';
    records = [];
    renderTable();
  });

  $('#sampleBtn').addEventListener('click', function () {
    $('#input').value =
      '产品编号\t产品名称\t规格型号\t数量\t单价\t金额\t税率\t备注\n' +
      'A001\t深沟球轴承\t6204-2RS\t100\t12.5\t1250\t13%\t现货\n' +
      'A002\t同步带\tHTD-5M-15\t20\t35\t700\t13%\t\n' +
      'A003\t伺服电机\tMSMF042L1U2M\t2\t3650\t7300\t13%\t含税\n' +
      'A004\t联轴器\tLK13-508\t6\t268\t1608\t13%\t加急';
  });

  // Ctrl + Enter 快速解析
  $('#input').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      $('#parseBtn').click();
    }
  });

  /* 初始化 */
  renderTable();

})();
</script>
</body>
</html>
